workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

validate-ingress:
  # Runner forbids pull-policy overrides; :latest defaults to Always in Kubernetes.
  image: alpine:latest
  variables:
    # The regression check reads the pinned pre-migration commit.
    GIT_DEPTH: "0"
  script:
    - apk add --no-cache git python3 py3-yaml
    - python3 dmz/traefik/check_access.py
    - python3 infra/longhorn/check_backup.py
