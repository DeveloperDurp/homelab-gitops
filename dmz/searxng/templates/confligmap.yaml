apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
data:
  settings.yml: |-
    use_default_settings: true
    search:
      formats:
        - html
        - json
    engines:
      # Inactive engines - failing with 403 on init from cluster egress IP
      # Using 'inactive: true' (not 'disabled: true') because wikidata's
      # init() runs even when disabled, and 403 from cloud IPs blocks startup
      - name: wikidata
        inactive: true
      - name: ahmia
        inactive: true
      - name: torch
        inactive: true