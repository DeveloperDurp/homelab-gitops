traefik:
  image:
    #    registry: harbor.durp.info
    #    repository: traefik
    pullPolicy: Always

  providers:
    kubernetesIngress:
      # All HTTP routes use IngressRoute with an enforced access-chain choice.
      enabled: false
    kubernetesCRD:
      allowCrossNamespace: true
      allowExternalNameServices: true
      allowEmptyServices: false

  deployment:
    replicas: 3
    revisionHistoryLimit: 1

  # volumes:
  #   - name: traefik-configmap
  #     mountPath: "/config"
  #     type: configMap

  service:
    spec:
      # Preserve the HAProxy/WireGuard peer so PROXY v2 trust works before IP filtering.
      externalTrafficPolicy: Local

  ingressRoute:
    dashboard:
      # Keep only our explicitly protected dashboard route.
      enabled: false

  ports:
    web:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
    gitlab-ssh:
      port: 9022
      expose:
        default: true
      exposedPort: 9022
    durpdeploy:
      port: 23187
      exposedPort: 23187
      protocol: TCP
      expose:
        default: true
    websecure:
      proxyProtocol:
        # racknerd VPS haproxy satnats ingress to 10.99.0.1 (wireguard tunnel)
        trustedIPs:
          - 10.99.0.1/32

  additionalArguments:
    #  - "--providers.file.filename=/config/config.yml"
    - "--serversTransport.insecureSkipVerify=true"
    - "--log.level=DEBUG"
    - --experimental.plugins.jwt.moduleName=github.com/traefik-plugins/traefik-jwt-plugin
    - --experimental.plugins.jwt.version=v0.7.0
    - --experimental.plugins.bouncer.moduleName=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
    - --experimental.plugins.bouncer.version=v1.4.2

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 80
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Pods
            value: 1
            periodSeconds: 60

  # -- [Resources](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/) for `traefik` container.
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      memory: "512Mi"
