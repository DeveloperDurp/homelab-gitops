# Mutating admission supplies internal-only when absent; validation is the safety net.
# Standard Ingress discovery is disabled in values.yaml; TCP routes are unchanged.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: dmz-ingress-access-chain
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [traefik.io]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [ingressroutes]
  validations:
    - expression: >-
        object.spec.routes.all(r,
          has(r.middlewares) && size(r.middlewares) > 0 &&
          has(r.middlewares[0].namespace) &&
          r.middlewares[0].namespace == 'traefik' &&
          (r.middlewares[0].name in ['internal-only', 'internet-access'] ||
            (r.middlewares[0].name == 'internal-go-proxy' &&
             object.metadata.name == 'athens' &&
             object.metadata.namespace == 'internalproxy' &&
             r.match == 'Host(`go.durp.info`)')))
      message: "Every HTTP route must start with a trusted access chain; internal-go-proxy is restricted to internalproxy/athens on go.durp.info."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: dmz-ingress-access-chain
spec:
  policyName: dmz-ingress-access-chain
  validationActions: [Deny]
