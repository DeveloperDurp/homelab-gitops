apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-proxy-provider
  namespace: traefik
spec:
  forwardAuth:
    address: http://ak-outpost-authentik-dmz-outpost.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: whitelist
  namespace: traefik
spec:
  ipAllowList:
    # LAN/VLAN clients and dedicated CI pods; never trust all pods or the proxy transit IP.
    sourceRange:
      # Includes Hermes workers 192.168.98.31/32/33; pod sources need their own CIDRs.
      - 192.168.0.0/16
      # Runner01/02/03-dmz spec.podCIDRs; review after node replacement.
      - 10.244.7.0/24
      - 10.244.8.0/24
      - 10.244.5.0/24

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: baseline-headers
  namespace: traefik
spec:
  headers:
    contentTypeNosniff: true

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: internal-only
  namespace: traefik
spec:
  chain:
    middlewares:
      - name: whitelist
      - name: baseline-headers

---
# Go-proxy-only exception: the dedicated runner nodes retain their pod source IPs.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: go-proxy-whitelist
  namespace: traefik
spec:
  ipAllowList:
    sourceRange:
      - 192.168.0.0/16
      # Match runner01/02/03-dmz spec.podCIDRs; review after node replacement.
      - 10.244.7.0/24
      - 10.244.8.0/24
      - 10.244.5.0/24

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: internal-go-proxy
  namespace: traefik
spec:
  chain:
    middlewares:
      - name: go-proxy-whitelist
      - name: baseline-headers

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: internet-access
  namespace: traefik
spec:
  chain:
    middlewares:
      - name: baseline-headers

