apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ashely
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ashely
  # Also import the later PAPERCLIP_API_KEY used for issue callbacks.
  dataFrom:
    - extract:
        key: {{ .Values.ashely.vaultKey | quote }}
  # Missing mandatory keys must fail reconciliation rather than expose an API
  # without authentication or start a gateway without its provider credential.
  data:
    {{- range $key := list "API_SERVER_KEY" "OPENCODE_GO_API_KEY" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $.Values.ashely.vaultKey | quote }}
        property: {{ $key }}
    {{- end }}
