apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ashely-ingress
spec:
  entryPoints: [websecure]
  routes:
    # Admission prepends traefik/internal-only; Hermes also requires its API key.
    - match: Host(`ashely.internal.durp.info`)
      kind: Rule
      services:
        - name: ashely-headless
          port: 8642
          nativeLB: false
  tls:
    secretName: ashely-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ashely-tls
spec:
  secretName: ashely-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames: [ashely.internal.durp.info]
