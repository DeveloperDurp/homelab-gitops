apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ashely-gateway
spec:
  podSelector:
    matchLabels:
      app: ashely
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - {protocol: TCP, port: 8642}
