apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-runner-cache
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gitlab-runner-cache
  data:
    - secretKey: accesskey
      remoteRef:
        key: kv/gitlab/runner-cache
        property: access-key
    - secretKey: secretkey
      remoteRef:
        key: kv/gitlab/runner-cache
        property: secret-key
