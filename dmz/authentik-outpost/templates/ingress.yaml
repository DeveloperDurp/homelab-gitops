apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik-dmz-outpost
  namespace: authentik
spec:
  entryPoints:
    - websecure
  routes:
    # Callback/session handling must reach the same outpost as forwardAuth.
    - match: Host(`authentik.durp.info`) && PathPrefix(`/outpost.goauthentik.io/`)
      kind: Rule
      priority: 100
      services:
        - name: ak-outpost-authentik-dmz-outpost
          port: 9000
  # Use Traefik's certificate store; authentik-tls lives in internalproxy.
  tls: {}
