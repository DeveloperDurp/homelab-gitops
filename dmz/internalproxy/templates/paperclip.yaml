apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: paperclip-infra-ingress
spec:
  entryPoints: [websecure]
  routes:
    # Admission prepends internal-only. Paperclip supplies built-in login/API auth.
    - match: Host(`paperclip.internal.durp.info`)
      kind: Rule
      services:
        - name: infra-cluster
          port: 443
          scheme: https
          passHostHeader: true
          serversTransport: paperclip-backend-tls
  tls:
    secretName: paperclip-tls
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: paperclip-backend-tls
spec:
  serverName: paperclip.internal.durp.info
  insecureSkipVerify: false
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: paperclip-tls
spec:
  secretName: paperclip-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames: [paperclip.internal.durp.info]
