apiVersion: v1
kind: Endpoints
metadata:
  name: gitlab-cluster
subsets:
  - addresses:
      - ip: 192.168.12.80
    ports:
      - name: https
        port: 443
        protocol: TCP
      - name: ssh
        port: 9022
        protocol: TCP        
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-cluster
spec:
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443
    - name: gitlab-ssh
      port: 9022
      protocol: TCP
      targetPort: 9022
      
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: gitlab-ssh
spec:
  entryPoints:
    - gitlab-ssh
  routes:
    - match: HostSNI(`*`)
      services:
        - name: gitlab-cluster
          port: 9022

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitlab-ingress
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`gitlab.durp.info`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: gitlab-cluster
          port: 443
          scheme: https
          serversTransport: gitlab-backend-tls          
  tls:
    secretName: gitlab-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitlab-ingress-old
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`gitlab-old.durp.info`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: unraid
          port: 9443
          scheme: https         
  tls:
    secretName: gitlab-old-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gitlab-old-tls
spec:
  secretName: gitlab-old-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "gitlab-old.durp.info"
  dnsNames:
    - "gitlab-old.durp.info"    
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gitlab-tls
spec:
  secretName: gitlab-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "gitlab.durp.info"
  dnsNames:
    - "gitlab.durp.info"

---
kind: Service
apiVersion: v1
metadata:
  name: gitlab-external-dns
  annotations:
    external-dns.alpha.kubernetes.io/hostname: gitlab.durp.info
spec:
  type: ExternalName
  externalName: durp.info

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitlab-registry
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`registry.durp.info`)
      kind: Rule
      services:
        - name: gitlab-cluster
          port: 443
          scheme: https
          serversTransport: gitlab-backend-tls
  tls:
    secretName: gitlab-registry-tls

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gitlab-registry-tls
spec:
  secretName: gitlab-registry-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "registry.durp.info"
  dnsNames:
    - "registry.durp.info"

---
kind: Service
apiVersion: v1
metadata:
  name: gitlab-registry-external-dns
  annotations:
    external-dns.alpha.kubernetes.io/hostname: registry.durp.info
spec:
  type: ExternalName
  externalName: durp.info

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pages-gitlab-ingress
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostRegexp(`{subdomain:[a-z0-9-]+}.pages.durp.info`) || Host(`pages.durp.info`)
      kind: Rule
      services:
        - name: gitlab-cluster
          port: 443
          scheme: https
          serversTransport: gitlab-backend-tls
  tls:
    secretName: pages-gitlab-tls

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pages-gitlab-tls
spec:
  secretName: pages-gitlab-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "pages.durp.info"
  dnsNames:
    - "pages.durp.info"
    - "*.pages.durp.info"

---
kind: Service
apiVersion: v1
metadata:
  name: pages-gitlab-external-dns
  annotations:
    external-dns.alpha.kubernetes.io/hostname: pages.durp.info, *.pages.durp.info
spec:
  type: ExternalName
  externalName: durp.info
  
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: gitlab-backend-tls
spec:
  serverName: gitlab.durp.info  
