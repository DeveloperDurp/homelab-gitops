apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: athens
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`go.durp.info`)
      kind: Rule
      middlewares:
        - name: whitelist
          namespace: traefik
      services:
        - name: infra-cluster
          port: 443
          scheme: https
          passHostHeader: true
          serversTransport: athens-backend-tls
  tls:
    secretName: athens-tls
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: athens-backend-tls
spec:
  serverName: go.durp.info
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: athens-tls
spec:
  secretName: athens-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames: [go.durp.info]
---
apiVersion: v1
kind: Service
metadata:
  name: athens-external-dns
  annotations:
    external-dns.alpha.kubernetes.io/hostname: go.durp.info
spec:
  type: ExternalName
  externalName: durp.info
