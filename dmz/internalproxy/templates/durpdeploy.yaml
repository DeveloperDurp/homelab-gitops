apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: durpdeploy-ingress
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`durpdeploy.durp.info`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: unraid
          port: 9090
          scheme: http
  tls:
    secretName: durpdeploy-tls

---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: durpdeploy-tls
spec:
  secretName: durpdeploy-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "durpdeploy.durp.info"
  dnsNames:
    - "durpdeploy.durp.info"

---

kind: Service
apiVersion: v1
metadata:
  name: durpdeploy-external-dns
  annotations:
    external-dns.alpha.kubernetes.io/hostname: durpdeploy.durp.info
spec:
  type: ExternalName
  externalName: durp.info
---
apiVersion: v1
kind: Service
metadata:
  name: durpdeploy-tcp
spec:
  ports:
    - name: tcp
      port: 23187
      targetPort: 23187
      protocol: TCP

---
apiVersion: v1
kind: Endpoints
metadata:
  name: durpdeploy-tcp
subsets:
  - addresses:
      - ip: 192.168.21.200
    ports:
      - name: tcp
        port: 23187
        protocol: TCP

---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: durpdeploy-tcp
spec:
  entryPoints:
    - durpdeploy
  routes:
    - match: HostSNI(`durpdeploy.durp.info`)
      services:
        - name: durpdeploy-tcp
          port: 23187
  tls:
    passthrough: true
