apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: garage-ingress
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`garage.internal.durp.info`) && PathPrefix(`/`)
      kind: Rule
      middlewares:
        - name: authentik-proxy-provider
          namespace: traefik
      services:
        - name: unraid
          port: 3909
          scheme: http
  tls:
    secretName: garage-tls

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: garage-tls
spec:
  secretName: garage-tls
  issuerRef:
    name: vault-issuer
    kind: ClusterIssuer
  commonName: garage.internal.durp.info
  dnsNames:
    - garage.internal.durp.info
