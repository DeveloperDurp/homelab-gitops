vault:
  injector:
    image:
      repository: harbor.durp.info/dockerhub/hashicorp/vault-k8s
    agentImage:
      repository: harbor.durp.info/dockerhub/hashicorp/vault
  global:
    enabled: true
    tlsDisable: false
    externalVaultAddr: "https://vault.infra.durp.info"
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 256Mi
        cpu: 250m
  
