apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: athens-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: athens-s3
  data:
    {{- range $property := list "endpoint" "region" "access-key" "secret-key" }}
    - secretKey: {{ $property }}
      remoteRef:
        key: {{ $.Values.s3.vaultKey | quote }}
        property: {{ $property }}
    {{- end }}
