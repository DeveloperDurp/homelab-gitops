apiVersion: v1
kind: Service
metadata:
  name: paperclip
spec:
  type: ClusterIP
  selector:
    app: paperclip
  ports:
    - name: http
      port: 3100
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: paperclip-headless
spec:
  clusterIP: None
  selector:
    app: paperclip
  ports:
    - name: http
      port: 3100
      targetPort: http
