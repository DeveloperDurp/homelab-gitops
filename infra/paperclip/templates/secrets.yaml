apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperclip
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: paperclip
  data:
    {{- range $key := list "BETTER_AUTH_SECRET" "PAPERCLIP_AGENT_JWT_SECRET" "PAPERCLIP_TOOL_ACTION_SIGNING_SECRET" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $.Values.paperclip.vaultKey | quote }}
        property: {{ $key }}
    {{- end }}
