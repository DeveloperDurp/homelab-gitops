apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: paperclip-ingress
spec:
  entryPoints:
    - websecure
  routes:
    # DMZ supplies the private front door; Paperclip supplies built-in auth.
    - match: Host(`paperclip.internal.durp.info`)
      kind: Rule
      services:
        - name: paperclip
          port: 3100
  tls:
    secretName: paperclip-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: paperclip-tls
spec:
  secretName: paperclip-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - paperclip.internal.durp.info
