argo-cd:
  global:
    revisionHistoryLimit: 1
    image:
      repository: harbor.durp.info/quay/argoproj/argocd
      imagePullPolicy: Always

  controller:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

  #server:
  #extraArgs:
  #  - --dex-server-plaintext
  #  - --dex-server=argocd-dex-server:5556
  # oidc.config: |
  #   name: AzureAD
  #   issuer: https://login.microsoftonline.com/TENANT_ID/v2.0
  #   clientID: CLIENT_ID
  #   clientSecret: $oidc.azuread.clientSecret
  #   requestedIDTokenClaims:
  #     groups:
  #       essential: true
  #   requestedScopes:
  #     - openid
  #     - profile
  #     - email

  dex:
    enabled: true
    image:
      repository: harbor.durp.info/github/dexidp/dex
      imagePullPolicy: Always
  redis:
    image:
      repository: harbor.durp.info/dockerhub/library/redis
    exporter:
      image:
        repository: harbor.durp.info/github/oliver006/redis_exporter

  configs:
    cm:
      create: true
      annotations: {}
      url: https://argocd.infra.durp.info
      oidc.tls.insecure.skip.verify: "true"
      accounts.provider-argocd: apiKey
      dex.config: |
        connectors:
          - config:
              issuer: https://authentik.durp.info/application/o/argocd/
              clientID: dbb8ffc06104fb6e7fac3e4ae7fafb1d90437625
              clientSecret: $client-secret:clientSecret
              insecureEnableGroups: true
              scopes:
                - openid
                - profile
                - email
                - groups
            name: authentik
            type: oidc
            id: authentik
      resource.exclusions: ""

    rbac:
      create: true
      policy.csv: |
        g, ArgoCD Admins, role:admin
        g, provider-argocd, role:admin
      scopes: "[groups]"

  controller:
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 2Gi

  server:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    route:
      enabled: false

  repoServer:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
