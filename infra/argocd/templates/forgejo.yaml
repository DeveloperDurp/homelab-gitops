apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://forgejo.durp.info/DeveloperDurp/homelab-gitops.git
    targetRevision: main
    path: infra/forgejo
  destination:
    name: in-cluster
    namespace: forgejo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
