apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubero-dev
  namespace: argocd
  annotations:
    # The chart installs Kubero CRDs; removal requires an explicit teardown,
    # not automated pruning of cluster-scoped API resources.
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default
  source:
    repoURL: https://gitlab.durp.info/durfy/homelab/gitops.git
    targetRevision: main
    path: dev/kubero
  destination:
    namespace: kubero
    name: dev
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
