apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: internal-proxy
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
spec:
  project: default
  source:
    repoURL: https://gitlab.durp.info/durfy/homelab/gitops.git
    targetRevision: main
    path: dmz/internalproxy
  destination:
    namespace: internalproxy
    name: dmz
  syncPolicy:
    automated:
      prune: true
      selfHeal: true  
    syncOptions:
      - CreateNamespace=true
      # Persist admission defaults even when client-side apply would be a no-op.
      - ServerSideApply=true

