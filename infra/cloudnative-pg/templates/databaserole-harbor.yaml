# DatabaseRole CR for the harbor application user.
#
# CNPG's inline managed.roles block (on the Cluster spec) has a known
# reconciliation issue: it logs "pending-roles" indefinitely without
# actually running ALTER ROLE. DatabaseRole is a separate CR type with
# its own dedicated controller that properly applies the password from
# passwordSecret on every reconciliation.
#
# This is the documented recommended path in CNPG 1.28+.
# See https://cloudnative-pg.io/docs/current/declarative_role_management/
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  # K8s resource name. Unique within the namespace.
  name: harbor
  namespace: harbor
spec:
  # In-cluster PostgreSQL role name (REQUIRED).
  name: harbor

  # Owning Cluster (REQUIRED).
  cluster:
    name: harbor-db

  # Ensure the role exists.
  ensure: present

  # Allow password login from clients.
  login: true

  # Grant membership in the postgres role so the user has DDL/DML
  # rights on the harbor database created by bootstrap.initdb.
  inRoles:
    - postgres

  # Source of the password for this role. The K8s secret is populated
  # by an ExternalSecret from Vault (kv/data/harbor/postgresql).
  passwordSecret:
    name: harbor-db-secret
