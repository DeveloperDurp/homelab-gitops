apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: harbor-db
  namespace: harbor
spec:
  # 2 instances: 1 primary + 1 replica for HA
  instances: 2

  # Storage for data
  storage:
    size: 20Gi
    storageClass: nfs-client
    pvcTemplate:
      accessModes:
        - ReadWriteOnce

  # Bootstrap: create the harbor database with the harbor user as owner.
  # CNPG auto-generates a random password for the bootstrap owner and
  # exposes it via the <cluster-name>-app Secret (basic-auth format
  # with username, password, host, port, dbname, uri, jdbc). The harbor
  # chart reads this Secret directly — no managed.roles, no
  # DatabaseRole CR, no external secret manager involvement.
  #
  # This avoids the broken roles_reconciler in CNPG 1.30 (which logs
  # 'pending-roles' indefinitely without running ALTER ROLE).
  #
  # See https://cloudnative-pg.io/docs/1.30/declarative_role_management/
  # and the auto-generated application secrets section of the bootstrap
  # docs.
  bootstrap:
    initdb:
      database: harbor
      owner: harbor

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
