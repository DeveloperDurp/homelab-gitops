apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: harbor-db
  namespace: harbor
spec:
  instances: 2

  storage:
    size: 20Gi
    storageClass: nfs-client
    pvcTemplate:
      accessModes:
        - ReadWriteOnce

  # Bootstrap: create the harbor database (owner is created by the
  # DatabaseRole CR in databaserole-harbor.yaml — the inline
  # managed.roles block has a known broken reconciler in CNPG 1.30).
  bootstrap:
    initdb:
      database: harbor

  # managed.roles block REMOVED — its roles_reconciler never actually
  # runs ALTER ROLE. Replaced by a dedicated DatabaseRole CR which has
  # its own controller that properly applies passwordSecret on every
  # reconciliation. See databaserole-harbor.yaml.

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
