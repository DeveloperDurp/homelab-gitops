apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-db
  namespace: forgejo
spec:
  instances: 3

  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie

  # Storage for data
  storage:
    size: 20Gi
    storageClass: nfs-client
    pvcTemplate:
      accessModes:
        - ReadWriteOnce

  # Bootstrap: create the forgejo database with the forgejo user as owner.
  # CNPG auto-generates a random password for the bootstrap owner and
  # exposes it via the <cluster-name>-app Secret (basic-auth format
  # with username, password, host, port, dbname, uri, jdbc). The
  # forgejo chart can read this Secret directly — no managed.roles, no
  # ExternalSecret involvement.
  #
  # This avoids the broken roles_reconciler in CNPG 1.30 (which logs
  # 'pending-roles' indefinitely without running ALTER ROLE).
  #
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: required

  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
