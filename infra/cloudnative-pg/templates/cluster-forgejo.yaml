apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-db
  namespace: forgejo
spec:
  # 2 instances: 1 primary + 1 replica for HA
  instances: 2

  # Storage for data
  storage:
    size: 20Gi
    storageClass: nfs-client
    pvcTemplate:
      accessModes:
        - ReadWriteOnce

  # Bootstrap: create the forgejo database with the forgejo user as owner.
  # CNPG auto-generates a random password for the bootstrap owner and
  # exposes it via the <cluster-name>-app Secret (basic-auth format
  # with username, password, host, port, dbname, uri, jdbc). The
  # forgejo chart can read this Secret directly — no managed.roles, no
  # ExternalSecret involvement.
  #
  # This avoids the broken roles_reconciler in CNPG 1.30 (which logs
  # 'pending-roles' indefinitely without running ALTER ROLE).
  #
  # Note: the forgejo chart today silently falls back to sqlite because
  # its env-to-ini plugin doesn't resolve the database.PASSWD Secret
  # reference (separate bug). The forgejo-db cluster exists but is
  # unused. Switching to the auto-generated app Secret pattern makes
  # the database ready when the chart config is fixed.
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
      # Delay creation of replica until first WAL is archived
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # PostgreSQL version managed by CNPG operator (defaults to 17 in v1.30)
  # Uncomment to pin a specific version:
  # imageName: ghcr.io/cloudnative-pg/postgresql:17

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
