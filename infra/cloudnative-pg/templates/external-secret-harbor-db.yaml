apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-db-secret
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-db-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: kv/data/harbor/postgresql
        property: password
