# Database password for Forgejo
# IMPORTANT: Replace the placeholder below with a real bcrypt hash or a strong password.
# To generate a strong password: openssl rand -base64 32
# Or use bcrypt: htpasswd -bnBC 10 "" "your_password" | tr -d ':\n'
---
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-db-secret
  namespace: forgejo
type: Opaque
stringData:
  # Bcrypt hash of the forgejo user password (replace placeholder below)
  # The current value is NOT a valid hash - regenerate before applying.
  password: "REPLACE_ME_WITH_BCRYPT_HASH"
  # Plain password for app reference (same value as above)
  # CNPG will hash the 'password' field at startup
