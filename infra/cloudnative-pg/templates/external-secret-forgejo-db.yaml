# Pulls the forgejo postgres password from Vault (kv/data/forgejo/postgresql)
# and materializes it as the K8s Secret that the forgejo-db Cluster CR references.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-db-secret
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: forgejo-db-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: kv/data/forgejo/postgresql
        property: password