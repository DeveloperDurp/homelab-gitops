harbor:
  expose:
    type: ingress
    tls:
      enabled: true
      certSource: auto
    ingress:
      controller: default
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        core: harbor.durp.info
        notary: notary.durp.info

  externalURL: https://harbor.durp.info

  persistence:
    enabled: true
    resourcePolicy: keep
    persistentVolumeClaim:
      registry:
        storageClass: nfs-client
        size: 50Gi

  database:
    type: external
    external:
      host: harbor-db-rw.harbor.svc
      port: 5432
      username: harbor
      coreDatabase: harbor
      # harbor-db-app is auto-generated by CNPG with the password for the
      # bootstrap owner (created via bootstrap.initdb.owner: harbor).
      # See infra/cloudnative-pg/templates/cluster-harbor.yaml.
      existingSecret: harbor-db-app
      sslmode: disable

  redis:
    type: internal

  trivy:
    enabled: false

  chartmuseum:
    enabled: false

  notary:
    enabled: false

  registry:
    type: filesystem
