---
apiVersion: v1
kind: Namespace
metadata:
  name: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/part-of: harbor

---
# Vault-backed secret for upstream registry credentials used by Harbor.
# Populate the values in Vault at kv/harbor/upstream before deploying.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-upstream-creds
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/part-of: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-upstream-creds
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: kv/harbor/upstream
        property: username
    - secretKey: password
      remoteRef:
        key: kv/harbor/upstream
        property: password
    - secretKey: ghcr_username
      remoteRef:
        key: kv/harbor/upstream
        property: ghcr_username
    - secretKey: ghcr_token
      remoteRef:
        key: kv/harbor/upstream
        property: ghcr_token
    - secretKey: quay_username
      remoteRef:
        key: kv/harbor/upstream
        property: quay_username
    - secretKey: quay_password
      remoteRef:
        key: kv/harbor/upstream
        property: quay_password

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-db-secret
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-db-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: kv/data/harbor/postgresql
        property: password
