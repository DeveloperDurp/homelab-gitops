renovate:
  image:
    registry: harbor.durp.info
    repository: github/renovatebot/renovate
    tag: 44.181.1

  cronjob:
    schedule: "0 1 * * *"

  renovate:
    config: |
      {
        "platform": "gitlab",
        "endpoint": "https://gitlab.durp.info/api/v4",
        "autodiscover": true,
        "autodiscoverFilter": ["durfy/**"]
      }
    configIsSecret: true
    persistence:
      cache:
        enabled: false

  existingSecret: renovate-token
