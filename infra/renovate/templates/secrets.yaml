apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  namespace: renovate
  name: renovate-token
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: renovate-token
  data:
    - secretKey: RENOVATE_TOKEN
      remoteRef:
        key: kv/renovate
        property: RENOVATE_TOKEN
