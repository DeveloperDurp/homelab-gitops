apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn-ingress
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`longhorn.infra.durp.info`) && PathPrefix(`/`)
      kind: Rule
      # Authentik and the default-private chain remain on the DMZ front door.
      services:
        - name: longhorn-frontend
          port: 80
  tls:
    secretName: longhorn-tls

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: longhorn-tls
spec:
  secretName: longhorn-tls
  issuerRef:
    name: vault-issuer
    kind: ClusterIssuer
  commonName: "longhorn.infra.durp.info"
  dnsNames:
    - "longhorn.infra.durp.info"
