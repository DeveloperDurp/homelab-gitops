# App-level secret for Forgejo (used for INSTALL_LOCK check, session signing)
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-app-secret
  namespace: forgejo
type: Opaque
stringData:
  # Generate with: openssl rand -hex 32
  SECRET_KEY: "REPLACE_ME_WITH_RANDOM_32_BYTE_HEX"
  # Internal token for forgejo hooks API
  INTERNAL_TOKEN: "REPLACE_ME_WITH_RANDOM_TOKEN"
  # JWT secret for signing
  JWT_SECRET: "REPLACE_ME_WITH_RANDOM_TOKEN"
