forgejo:
  replicaCount: 1
  strategy:
    type: Recreate

  # Force service name to "forgejo" (matches the cert/secret names in this chart)
  fullnameOverride: forgejo

  image:
    registry: code.forgejo.org
    repository: forgejo/forgejo
    tag: ""
    pullPolicy: Always

  service:
    http:
      type: ClusterIP
      port: 3000
    ssh:
      type: ClusterIP
      port: 22

  # Persistence for repos, avatars, attachments, etc.
  persistence:
    enabled: true
    size: 100Gi
    storageClass: nfs-client
    accessModes:
      - ReadWriteOnce

  # Native Ingress (rendered by the chart) - Traefik ingress controller
  # picks up networking.k8s.io/v1 Ingress via ingressClassName.
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-production
    hosts:
      - host: forgejo.durp.info
        paths:
          - path: /
            pathType: Prefix
            port: http
    tls:
      - secretName: forgejo-tls
        hosts:
          - forgejo.durp.info

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

  gitea:
    admin:
      existingSecret: forgejo-admin
      passwordMode: initialOnlyNoReset

    additionalConfigFromEnvs:
      - name: FORGEJO__DATABASE__PASSWD
        valueFrom:
          secretKeyRef:
            name: forgejo-db-app
            key: password

    livenessProbe:
      enabled: true
      initialDelaySeconds: 60
      periodSeconds: 30
    readinessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 10

    config:
      APP_NAME: "Durp Forgejo"
      RUN_MODE: prod

      server:
        DOMAIN: forgejo.durp.info
        SSH_DOMAIN: forgejo.durp.info
        ROOT_URL: "https://forgejo.durp.info/"
        LFS_START_SERVER: true
        PROTOCOL: http
        APP_DATA_PATH: /data/forgejo-postgres
        DISABLE_SSH: false
        SSH_PORT: 22
        OFFLINE_MODE: false

      repository:
        ROOT: /data/forgejo-postgres/git/repositories

      database:
        DB_TYPE: postgres
        HOST: "forgejo-db-rw.forgejo.svc.cluster.local:5432"
        NAME: forgejo
        USER: forgejo
        SCHEMA: public
        SSL_MODE: require

      security:
        INSTALL_LOCK: true
        REVERSE_PROXY_LIMIT: "1"
        REVERSE_PROXY_TRUSTED_PROXIES: "*"

      service:
        DISABLE_REGISTRATION: true
        ENABLE_NOTIFY_MAIL: false
        ENABLE_CAPTCHA: true
        REQUIRE_SIGNIN_VIEW: false

      webhook:
        ALLOWED_HOST_LIST: "forgejo.durp.info"

      session:
        COOKIE_SECURE: true
        COOKIE_SAMESITE: lax

      log:
        LEVEL: info
        MODE: console
