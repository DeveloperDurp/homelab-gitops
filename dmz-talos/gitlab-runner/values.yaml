gitlab-runner:

  image:
    registry: registry.durp.info
    image: gitlab-org/gitlab-runner

  imagePullPolicy: Always
  gitlabUrl: https://gitlab.durp.info/
  unregisterRunner: false
  terminationGracePeriodSeconds: 3600
  concurrent: 10
  checkInterval: 30

  rbac:
    create: true
    rules: []
    clusterWideAccess: false
    podSecurityPolicy:
      enabled: false
      resourceNames:
        - gitlab-runner

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  service:
    enabled: true
    annotations: {}

  runners:
    config: |
      [[runners]]
        [runners.kubernetes]
          namespace = "{{.Release.Namespace}}"
          image = "ubuntu:22.04"
          privileged = true

    executor: kubernetes
    name: "k3s"
    runUntagged: true
    privileged: true
    secret: gitlab-secret
    builds:
      cpuLimit: 2
      cpuLimitOverwriteMaxAllowed: 4
      memoryLimit: 4Gi
      memoryLimitOverwriteMaxAllowed: 6Gi
      cpuRequests: 500m
      cpuRequestsOverwriteMaxAllowed: 2
      memoryRequests: 1Gi
      memoryRequestsOverwriteMaxAllowed: 2Gi

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    privileged: false
    capabilities:
      drop: ["ALL"]

  podSecurityContext:
    runAsUser: 100
    fsGroup: 65533

  resources:
    limits:
      memory: 2Gi
    requests:
      memory: 128Mi
      cpu: 50m
